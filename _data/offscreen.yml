  - step: "Inspiration"
    description: "Ideas come from everywhere - a debugging session, a sunset, or a mathematical concept"
    
  - step: "Sketching"
    description: "Quick sketches to capture the essence before it fades"
    
  - step: "Experimentation"
    description: "Trying different mediums and techniques - much like testing different algorithms"
    
  - step: "Creation"
